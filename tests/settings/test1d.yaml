ARGS:
  epochs: 15000
  batch_size: -1
  patience: 2000

MODEL:
  f_hid: 20
  depth: 5
  in_lb: '[-1.]'
  in_ub: '[1.]'
  act: tanh
  seed: 42
  lr: 0.0002
  beta: 0.1
  dyn_norm: #'dyn_norm' #"max_avg"
  
NS:
  nx: [100]

IN_VAR_NAMES:
 [t]

OUT_VAR_NAMES:
 [u] #beta_max]

CUSTOM_CONSTS:
  cost_inf: 4.
  beta_max: 20.
  gamma: 2.
  S_0: 0.7

CUSTOM_FUNCS:
  exact: t*0

  
CONDS:
  
   #- alpha(vars,u_)**2
  initial:
     eq_string: u
     right_side: 0*vars[:, 0] 
     point_area: '[[tmin, tmin]]'
     N: 1
     
  pde:
    eq_string: '(d/dt)^2 u + (  vars[:, 0] *0. + 1.)'
    right_side: 0*vars[:, 0] # 0*vars[:, 0]+20. 
    point_area: '[[tmin, tmax]]'
    N: 20000
    
  terminal:
     eq_string: u
     right_side: 0*vars[:, 0]
     point_area: '[[tmax, tmax]]'
     N: 1

